<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>La cocina de la semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light only;
    --bg:#F1EFE2; --paper:#FFFDF7; --ink:#2B2A26; --ink-soft:#6d6a58;
    --primary:#2F5233; --primary-dark:#1E3924; --primary-light:#E4EFDE;
    --accent:#C2531F; --accent-dark:#8f3a19; --accent-light:#F6E1D2;
    --mustard:#D89A2E; --mustard-light:#FBEDD1;
    --sky:#4C86A8; --sky-light:#DDECF2;
    --line:#E1DAC4;
    --radius-lg:18px; --radius-md:12px;
    --shadow: 0 1px 2px rgba(43,42,38,0.05), 0 6px 18px rgba(43,42,38,0.07);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Nunito',system-ui,-apple-system,sans-serif;
    font-size:15.5px; line-height:1.5; -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:760px;margin:0 auto;padding:16px 16px 50px;}
  header.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;}
  h1{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:26px;margin:0 0 2px;color:var(--primary-dark);}
  .tagline{color:var(--ink-soft);font-size:13px;margin:0;}
  .personas-box{
    background:var(--paper);border:1px solid var(--line);border-radius:20px;
    padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);
  }
  .personas-box label{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .stepper{display:flex;align-items:center;gap:6px;}
  .stepper button{
    width:32px;height:32px;border-radius:9px;border:none;background:var(--primary);
    color:#fff;font-size:18px;line-height:1;cursor:pointer;
  }
  .stepper button:active{transform:scale(0.94);}
  .stepper span{min-width:22px;text-align:center;font-weight:800;font-family:'Baloo 2',sans-serif;font-size:17px;color:var(--primary-dark);}

  nav.tabs{
    display:flex;gap:6px;margin-bottom:20px;
    background:var(--paper);border:1px solid var(--line);border-radius:26px;
    padding:5px;box-shadow:var(--shadow);
    position:sticky;top:8px;z-index:30;
  }
  nav.tabs button{
    flex:1;appearance:none;border:none;background:transparent;border-radius:22px;
    padding:11px 6px;font-family:'Nunito',sans-serif;font-size:13.5px;font-weight:800;
    color:var(--ink-soft);cursor:pointer;white-space:nowrap;
  }
  nav.tabs button.active{background:var(--primary);color:#fff;}

  .noscript-warn{
    background:var(--accent-light);border:1.5px solid var(--accent);border-radius:var(--radius-lg);
    padding:14px 16px;font-size:14px;color:var(--accent-dark);font-weight:700;margin-bottom:18px;line-height:1.45;
  }

  .panel{display:none;}
  .panel.active{display:block;}
  .section-title{font-family:'Baloo 2',sans-serif;font-size:18px;font-weight:700;color:var(--primary-dark);margin:0 0 10px;}

  .week-list{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
  .day-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:12px 14px;}
  .day-card .day-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .day-card .day-name{
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14.5px;color:var(--primary);
    background:var(--primary-light);border-radius:20px;padding:3px 12px;
  }
  .day-card select{
    width:100%;border:1px solid var(--line);border-radius:var(--radius-md);padding:11px 10px;
    font-size:14.5px;font-family:'Nunito',sans-serif;font-weight:700;background:#fff;color:var(--ink);
  }
  .day-card .day-note{font-size:12.5px;color:var(--ink-soft);margin-top:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .mambo-badge{display:inline-flex;align-items:center;gap:4px;background:var(--mustard-light);color:#7a531a;border-radius:20px;padding:2px 9px 2px 4px;font-size:11.5px;font-weight:700;}
  .season-badge{display:inline-flex;align-items:center;gap:4px;background:var(--sky-light);color:#2f5f78;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700;}
  .time-badge{display:inline-flex;align-items:center;gap:4px;background:var(--accent-light);color:var(--accent-dark);border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700;}
  .hecho-row{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .hecho-row input{width:19px;height:19px;accent-color:var(--primary);}
  .hecho-row.done{color:var(--primary-dark);}

  .postres-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .chip-check{display:flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:9px 14px;cursor:pointer;font-size:13.5px;font-weight:700;box-shadow:var(--shadow);}
  .chip-check input{accent-color:var(--accent);width:17px;height:17px;}

  .recipes-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .btn{appearance:none;border:none;border-radius:24px;padding:10px 18px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13.5px;cursor:pointer;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:active{background:var(--accent-dark);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
  .btn-ghost:active{background:var(--primary-light);color:var(--primary-dark);}
  .btn-text{background:none;border:none;color:var(--accent-dark);font-weight:800;font-size:13px;cursor:pointer;padding:6px;}

  .recipe-list{display:flex;flex-direction:column;gap:14px;}
  .recipe-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow);}
  .rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .rc-head h3{font-family:'Baloo 2',sans-serif;font-size:17.5px;margin:0;color:var(--ink);}
  .rc-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .tag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .tag-principal{background:var(--primary-light);color:var(--primary-dark);}
  .tag-postre{background:var(--mustard-light);color:#8a5c14;}
  .scaled-note{font-size:11.5px;color:var(--ink-soft);font-weight:700;margin:0 0 6px;}
  .ingredient-line{font-size:13.5px;color:var(--ink-soft);margin:0 0 3px;display:flex;gap:6px;align-items:baseline;}
  .ingredient-line .emo{font-size:14px;}
  .recipe-note{font-size:12.5px;font-style:italic;color:var(--ink-soft);margin-top:8px;}
  .rc-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .steps-box{margin-top:10px;background:var(--primary-light);border-radius:var(--radius-md);padding:10px 14px;display:none;}
  .steps-box.open{display:block;}
  .steps-box ol{margin:0;padding-left:18px;}
  .steps-box li{font-size:13.5px;margin-bottom:6px;color:var(--primary-dark);}

  .search-bar{margin-bottom:10px;}
  .search-bar input{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:24px;
    font-family:'Nunito',sans-serif;font-size:14.5px;background:var(--paper);
    box-shadow:var(--shadow);-webkit-appearance:none;
  }
  .filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
  .filter-chip{
    flex:0 0 auto;appearance:none;border:1.5px solid var(--line);background:var(--paper);
    border-radius:20px;padding:7px 14px;font-family:'Nunito',sans-serif;font-size:12.5px;
    font-weight:800;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
  }
  .filter-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .sort-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .sort-row label{font-size:12.5px;font-weight:800;color:var(--ink-soft);}
  .sort-row select{
    flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-md);
    font-family:'Nunito',sans-serif;font-size:13.5px;background:var(--paper);color:var(--ink);
  }
  .result-count{font-size:12.5px;color:var(--ink-soft);font-weight:700;margin:0 0 10px;}
  .no-results{
    text-align:center;padding:26px 20px;color:var(--ink-soft);font-size:14px;
    background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius-lg);
  }

  .idea-form{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:14px;box-shadow:var(--shadow);margin-bottom:18px;display:flex;flex-direction:column;gap:8px;
  }
  .idea-form input{
    width:100%;padding:11px;border:1px solid var(--line);border-radius:var(--radius-md);
    font-family:'Nunito',sans-serif;font-size:14.5px;background:#fff;
  }
  .idea-card{
    background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--mustard);
    border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px;
  }
  .idea-card h4{font-family:'Baloo 2',sans-serif;font-size:16px;margin:0 0 4px;color:var(--ink);}
  .idea-card p{font-size:13px;color:var(--ink-soft);margin:0 0 10px;}
  .idea-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .ideas-empty{
    text-align:center;padding:30px 20px;color:var(--ink-soft);font-size:14px;
    background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius-lg);
  }

  .alert-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--radius-lg);margin-bottom:18px;font-size:13.5px;font-weight:800;}
  .alert-pending{background:var(--mustard-light);color:#8a5c14;}
  .alert-done{background:var(--primary-light);color:var(--primary-dark);}

  .shop-category{
    margin-bottom:16px;background:var(--paper);border:1px solid var(--line);
    border-radius:var(--radius-lg);padding:4px 14px 10px;box-shadow:var(--shadow);
  }
  .shop-category h4{font-family:'Baloo 2',sans-serif;font-size:15px;color:var(--primary);border-bottom:2px solid var(--primary-light);padding:10px 0 7px;margin:0 0 4px;}
  .shop-item{
    display:flex;align-items:center;gap:10px;padding:11px 2px;font-size:14.5px;
    border-bottom:1px solid var(--primary-light);flex-wrap:wrap;
  }
  .shop-item:last-child{border-bottom:none;}
  .shop-item .chk{width:21px;height:21px;accent-color:var(--primary);flex-shrink:0;}
  .shop-item .emo{font-size:17px;}
  .shop-main{flex:1;min-width:150px;}
  .shop-main .buy-line{font-weight:700;color:var(--primary-dark);}
  .shop-main .buy-line .qty{color:var(--accent-dark);font-weight:800;}
  .shop-main .buy-line.enough{color:var(--ink-soft);font-weight:600;}
  .shop-item.checked .buy-line,
  .shop-item.checked .buy-line .qty{text-decoration:line-through;color:#a9a593;font-weight:600;}
  .shop-sub{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:1px;}
  .stock-box{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);font-weight:700;}
  .stock-box input{
    width:58px;padding:6px 7px;border:1.5px solid var(--line);border-radius:8px;
    font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;text-align:center;
    background:#fff;color:var(--primary-dark);
  }
  .stock-box input:focus{border-color:var(--primary);outline:none;}
  .shop-empty{color:var(--ink-soft);font-size:13.5px;font-style:italic;padding:4px 0 6px;}

  footer.meta{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap;gap:8px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(43,42,38,0.45);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--paper);border-radius:20px 20px 0 0;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:20px 20px 26px;box-shadow:0 -10px 40px rgba(0,0,0,0.25);}
  @media (min-width:700px){
    .modal-overlay{align-items:center;padding:20px;}
    .modal{border-radius:18px;}
  }
  .modal h2{font-family:'Baloo 2',sans-serif;margin:0 0 14px;font-size:19px;color:var(--primary-dark);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:800;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius-md);
    font-family:'Nunito',sans-serif;font-size:14.5px;background:#fff;
  }
  .field textarea{min-height:80px;resize:vertical;}
  .check-field{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13.5px;font-weight:700;}
  .check-field input{width:18px;height:18px;}
  .ing-row{display:grid;grid-template-columns:1.6fr 0.8fr 0.9fr 1fr auto;gap:5px;margin-bottom:6px;align-items:center;}
  .ing-row input,.ing-row select{padding:7px 6px;border:1px solid var(--line);border-radius:8px;font-size:12px;}
  .ing-row .rm{background:none;border:none;color:var(--accent);cursor:pointer;font-size:18px;line-height:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .confirm-modal .modal{max-width:380px;}
  .confirm-text{font-size:14px;margin-bottom:16px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:60;max-width:90vw;text-align:center;}
  .toast.show{opacity:0.95;}
  @media (max-width:480px){ .ing-row{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>🍲 La cocina de la semana</h1>
      <p class="tagline">Menú, recetas y compras</p>
    </div>
    <div class="personas-box">
      <label>Personas</label>
      <div class="stepper">
        <button id="personasMinus" type="button">–</button>
        <span id="personasValue">4</span>
        <button id="personasPlus" type="button">+</button>
      </div>
    </div>
  </header>

  <noscript>
    <div class="noscript-warn">
      Este visor no ejecuta scripts, así que la app no puede funcionar acá.
      Tocá compartir y elegí "Abrir en Safari", o abrila desde el chat en vez de descargarla.
    </div>
  </noscript>

  <nav class="tabs">
    <button data-tab="semana" class="active">📅 Semana</button>
    <button data-tab="recetas">📖 Recetas</button>
    <button data-tab="ideas">💡 Ideas</button>
    <button data-tab="compras">🛒 Compras</button>
  </nav>

  <section id="panel-semana" class="panel active">
    <div class="week-list" id="weekList"></div>
    <div class="section-title">🍪 Postres para esta semana</div>
    <div class="postres-row" id="postresRow"></div>
  </section>

  <section id="panel-recetas" class="panel">
    <div class="recipes-toolbar">
      <div class="section-title" style="margin:0;">Tus recetas</div>
      <button class="btn btn-accent" id="btnNuevaReceta">+ Nueva</button>
    </div>
    <div class="search-bar">
      <input type="search" id="recipeSearch" placeholder="Buscar receta o ingrediente…">
    </div>
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" data-filter="todas">Todas</button>
      <button class="filter-chip" data-filter="principal">Principales</button>
      <button class="filter-chip" data-filter="postre">Postres</button>
      <button class="filter-chip" data-filter="mambo">Mambo</button>
      <button class="filter-chip" data-filter="rapidas">Hasta 30 min</button>
    </div>
    <div class="sort-row">
      <label for="recipeSort">Ordenar</label>
      <select id="recipeSort">
        <option value="alfabetico">Por nombre</option>
        <option value="tiempo">Por tiempo (más rápida primero)</option>
        <option value="tipo">Por tipo</option>
      </select>
    </div>
    <div class="recipe-list" id="recipeList"></div>
  </section>

  <section id="panel-ideas" class="panel">
    <div class="idea-form">
      <input type="text" id="ideaTitulo" placeholder="Idea de plato o receta…">
      <input type="text" id="ideaNota" placeholder="Nota (opcional): qué te gustó, con qué probarla…">
      <button class="btn btn-accent" id="btnAddIdea">Anotar idea</button>
    </div>
    <div id="ideasList"></div>
  </section>

  <section id="panel-compras" class="panel">
    <div id="alertBanner"></div>
    <div id="shoppingList"></div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-ghost" id="btnResetChecks">🔄 Empezar semana nueva</button>
      <button class="btn btn-ghost" id="btnResetStock">Vaciar "ya tengo"</button>
    </div>
  </section>

  <footer class="meta">
    <span id="saveStatus">Cargando…</span>
    <button class="btn-text" id="btnResetData">Restablecer ejemplo</button>
  </footer>
</div>

<div class="modal-overlay" id="recipeModalOverlay">
  <div class="modal">
    <h2 id="recipeModalTitle">Nueva receta</h2>
    <div class="field"><label>Nombre</label><input type="text" id="rNombre" placeholder="Ej: Tarta de zapallito"></div>
    <div class="field"><label>Tipo</label>
      <select id="rCategoria"><option value="principal">Plato principal</option><option value="postre">Postre / merienda</option></select>
    </div>
    <div class="field"><label>Tiempo total de cocción (minutos)</label><input type="number" id="rTiempo" min="0" step="1" placeholder="Ej: 45"></div>
    <label class="check-field"><input type="checkbox" id="rMambo"> 🤖 Se usa la Mambo Victory</label>
    <label class="check-field"><input type="checkbox" id="rVaporeras"> ♨️ Usa las 2 vaporeras</label>
    <label class="check-field"><input type="checkbox" id="rEstacional"> ☀️ Es estacional (depende del clima)</label>
    <div class="field">
      <label>Ingredientes (cantidades para 4 personas)</label>
      <div id="ingRows"></div>
      <button type="button" class="btn-text" id="btnAddIng">+ agregar ingrediente</button>
    </div>
    <div class="field"><label>Paso a paso (un paso por línea)</label><textarea id="rPasos" placeholder="Cortar la cebolla…"></textarea></div>
    <div class="field"><label>Notas (opcional)</label><input type="text" id="rNotas" placeholder="Ej: milanesas ya rebozadas"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelRecipe">Cancelar</button>
      <button class="btn btn-accent" id="btnSaveRecipe">Guardar</button>
    </div>
  </div>
</div>

<div class="modal-overlay confirm-modal" id="confirmOverlay">
  <div class="modal">
    <h2 id="confirmTitle">¿Confirmar?</h2>
    <p class="confirm-text" id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnConfirmNo">Cancelar</button>
      <button class="btn btn-accent" id="btnConfirmYes">Sí, continuar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCHEMA_VERSION = 3;
const STORAGE_KEY = 'cocina-semanal-datos';
const STORAGE_TIMEOUT_MS = 3000;
const DIAS = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
const DIAS_LABEL = {lunes:'Lunes',martes:'Martes',miercoles:'Miércoles',jueves:'Jueves',viernes:'Viernes',sabado:'Sábado',domingo:'Domingo'};
const CATEGORIAS_COMPRA = ['Verdulería','Dietética','Carnicería','Almacén'];
const UNIDADES_CONTINUAS = ['g','kg','ml','l'];

const EMOJI_MAP = [
  ['lenteja','🫘'],['cebolla','🧅'],['zanahoria','🥕'],['calabaza','🎃'],['zapallito','🥒'],
  ['papa','🥔'],['batata','🍠'],['tomate','🍅'],['ajo','🧄'],['perejil','🌿'],['lechuga','🥬'],
  ['hoja','🥬'],['banana','🍌'],['manzana','🍎'],['limón','🍋'],['limon','🍋'],['avena','🌾'],
  ['azúcar','🟤'],['azucar','🟤'],['harina','🌾'],['huevo','🥚'],['queso','🧀'],['aceite','🫒'],
  ['sal fina','🧂'],['vainilla','🧴'],['polvo de hornear','🫧'],['canela','🟠'],['uva','🍇'],
  ['pollo','🍗'],['milanesa','🍗'],['lomo','🥩'],['solomillo','🥩'],['pescado','🐟'],

function getEmoji(nombre, categoria){

  if(!window.storage || typeof window.storage.get !== 'function') return null;
  try{
    const res = await withTimeout(window.storage.get(STORAGE_KEY, true), STORAGE_TIMEOUT_MS);
    if(res && res.value) return JSON.parse(res.value);
    return null;
  }catch(e){ return undefined; }
}
async function saveState(){
  const statusEl = document.getElementById('saveStatus');
  if(!storageOk){ statusEl.textContent = 'Modo sin guardado: los cambios duran hasta que cierres.'; return; }
  try{
    await withTimeout(window.storage.set(STORAGE_KEY, JSON.stringify(state), true), STORAGE_TIMEOUT_MS);
    statusEl.textContent = 'Guardado ✓ — compartido con la familia.';
  }catch(e){
    storageOk = false;
    statusEl.textContent = 'Modo sin guardado: los cambios duran hasta que cierres.';
  }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

function findRecipe(id){ return state.recipes.find(r=>r.id===id); }
function scaleRaw(amount){ return amount * state.personas / 4; }
function roundFinal(amount, unidad){
  if(UNIDADES_CONTINUAS.includes(unidad)){
    if(unidad==='kg'||unidad==='l') return Math.round(amount*10)/10;
    return Math.round(amount/5)*5;
  }
  return Math.ceil(amount - 1e-9);
}
function ingKey(nombre, unidad){ return nombre.trim().toLowerCase()+'|'+unidad; }

function computeShoppingTotals(){
  const totals = {};
  const ids = [...Object.values(state.semana).filter(Boolean),
               ...Object.entries(state.postres).filter(([,v])=>v).map(([k])=>k)];
  ids.forEach(id=>{
    const receta = findRecipe(id);
    if(!receta) return;
    receta.ingredientes.forEach(ing=>{
      const key = ingKey(ing.nombre, ing.unidad);
      if(!totals[key]) totals[key] = {nombre:ing.nombre, unidad:ing.unidad, categoria:ing.categoria, raw:0};
      totals[key].raw += scaleRaw(ing.cantidad);
    });
  });
  return totals;
}

function badgesHtml(r){
  let html = '';
  if(r.tiempo) html += `<span class="time-badge">⏱️ ${r.tiempo} min</span>`;
  if(r.usaMambo) html += `<span class="mambo-badge">${mamboIcon()} Mambo${r.vaporeras?' · 2 vaporeras':''}</span>`;
  if(r.estacional) html += `<span class="season-badge">☀️ clima cálido</span>`;
  return html;
}

function renderWeek(){
  const list = document.getElementById('weekList');
  list.innerHTML='';
  const principales = state.recipes.filter(r=>r.categoria==='principal');
  DIAS.forEach(dia=>{
    const card = document.createElement('div');
    card.className='day-card';
    const asignadoId = state.semana[dia];
    const receta = asignadoId ? findRecipe(asignadoId) : null;
    let options = `<option value="">Sin planificar</option>`;
    principales.forEach(r=>{
      options += `<option value="${r.id}" ${asignadoId===r.id?'selected':''}>${r.estacional?'☀️ ':''}${escapeHtml(r.nombre)}</option>`;
    });
    const hecho = !!state.hechos[dia];
    card.innerHTML = `
      <div class="day-top"><span class="day-name">${DIAS_LABEL[dia]}</span></div>
      <select data-dia="${dia}">${options}</select>
      <div class="day-note">${receta ? badgesHtml(receta) : ''}</div>
      ${receta ? `<label class="hecho-row ${hecho?'done':''}"><input type="checkbox" data-hecho="${dia}" ${hecho?'checked':''}> ${hecho?'Listo, lo hicimos':'Marcar como hecho'}</label>` : ''}
    `;
    list.appendChild(card);
  });
  list.querySelectorAll('select').forEach(sel=>{
    sel.addEventListener('change', async (e)=>{
      const dia = e.target.getAttribute('data-dia');
      state.semana[dia] = e.target.value || null;
      state.hechos[dia] = false;
      renderWeek(); renderShoppingList();
      await saveState();
    });
  });
  list.querySelectorAll('[data-hecho]').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      state.hechos[e.target.getAttribute('data-hecho')] = e.target.checked;
      renderWeek();
      await saveState();
    });
  });

  const postresRow = document.getElementById('postresRow');
  postresRow.innerHTML='';
  state.recipes.filter(r=>r.categoria==='postre').forEach(r=>{
    const label = document.createElement('label');
    label.className='chip-check';
    label.innerHTML = `<input type="checkbox" data-postre="${r.id}" ${state.postres[r.id]?'checked':''}> ${escapeHtml(r.nombre)}`;
    postresRow.appendChild(label);
  });
  postresRow.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      state.postres[e.target.getAttribute('data-postre')] = e.target.checked;
      renderShoppingList();
      await saveState();
    });
  });
}

function recetasVisibles(){
  const q = recipeQuery.trim().toLowerCase();
  let lista = state.recipes.filter(r=>{
    if(recipeFilter==='principal' && r.categoria!=='principal') return false;
    if(recipeFilter==='postre' && r.categoria!=='postre') return false;
    if(recipeFilter==='mambo' && !r.usaMambo) return false;
    if(recipeFilter==='rapidas' && !(r.tiempo && r.tiempo<=30)) return false;
    if(!q) return true;
    if(r.nombre.toLowerCase().includes(q)) return true;
    if((r.notas||'').toLowerCase().includes(q)) return true;
    return r.ingredientes.some(i=>i.nombre.toLowerCase().includes(q));
  });
  if(recipeSort==='alfabetico'){
    lista.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  } else if(recipeSort==='tiempo'){
    lista.sort((a,b)=>(a.tiempo||9999)-(b.tiempo||9999));
  } else if(recipeSort==='tipo'){
    lista.sort((a,b)=> a.categoria===b.categoria
      ? a.nombre.localeCompare(b.nombre,'es')
      : (a.categoria==='principal' ? -1 : 1));
  }
  return lista;
}

function renderRecipes(){
  const list = document.getElementById('recipeList');
  list.innerHTML='';
  const visibles = recetasVisibles();

  const count = document.createElement('p');
  count.className='result-count';
  count.textContent = visibles.length===state.recipes.length
    ? `${state.recipes.length} recetas`
    : `${visibles.length} de ${state.recipes.length} recetas`;
  list.appendChild(count);

  if(visibles.length===0){
    const empty = document.createElement('div');
    empty.className='no-results';
    empty.textContent = 'Ninguna receta coincide. Probá con otra palabra o sacá los filtros.';
    list.appendChild(empty);
    return;
  }

  visibles.forEach(r=>{
    const card = document.createElement('div');
    card.className='recipe-card';
    const ingHtml = r.ingredientes.map(i=>{
      const amt = roundFinal(scaleRaw(i.cantidad), i.unidad);
      return `<p class="ingredient-line"><span class="emo">${getEmoji(i.nombre,i.categoria)}</span> ${amt} ${escapeHtml(i.unidad)} — ${escapeHtml(i.nombre)}</p>`;
    }).join('');
    const pasos = (r.pasos && r.pasos.length) ? r.pasos : [];
    const stepsHtml = pasos.length
      ? `<ol>${pasos.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ol>`
      : '<p style="font-size:13px;margin:0;">Todavía no tiene paso a paso cargado.</p>';
    const isOpen = openStepsIds.has(r.id);
    card.innerHTML = `
      <div class="rc-head">
        <h3>${escapeHtml(r.nombre)}</h3>
        <span class="tag ${r.categoria==='postre'?'tag-postre':'tag-principal'}">${r.categoria==='postre'?'Postre':'Principal'}</span>
      </div>
      <div class="rc-badges">${badgesHtml(r)}</div>
      <p class="scaled-note">Cantidades para ${state.personas} ${state.personas===1?'persona':'personas'}</p>
      ${ingHtml}
      ${r.notas?`<p class="recipe-note">${escapeHtml(r.notas)}</p>`:''}
      <div class="rc-actions">
        <button class="btn btn-ghost" data-steps="${r.id}">${isOpen?'Ocultar pasos':'Ver paso a paso'}</button>
        <button class="btn btn-ghost" data-edit="${r.id}">Editar</button>
        <button class="btn btn-ghost" data-del="${r.id}">Eliminar</button>
      </div>
      <div class="steps-box ${isOpen?'open':''}">${stepsHtml}</div>
    `;
    list.appendChild(card);
  });
  list.querySelectorAll('[data-steps]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.getAttribute('data-steps');
    if(openStepsIds.has(id)) openStepsIds.delete(id); else openStepsIds.add(id);
    renderRecipes();
  }));
  list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openRecipeModal(b.getAttribute('data-edit'))));
  list.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.getAttribute('data-del');
    const receta = findRecipe(id);
    openConfirm(`¿Eliminar "${receta.nombre}"?`, async ()=>{
      state.recipes = state.recipes.filter(r=>r.id!==id);
      Object.keys(state.semana).forEach(d=>{ if(state.semana[d]===id) state.semana[d]=null; });
      delete state.postres[id];
      renderAll(); await saveState();
    });
  }));
}

function renderShoppingList(){
  const totals = computeShoppingTotals();
  const banner = document.getElementById('alertBanner');
  const container = document.getElementById('shoppingList');
  container.innerHTML='';

  const keys = Object.keys(totals);
  const pendientes = keys.filter(k=>{
    const it = totals[k];
    const comprar = Math.max(0, roundFinal(it.raw, it.unidad) - (state.stock[k]||0));
    return comprar > 0 && !state.compras[k];
  });

  if(keys.length===0){
    banner.innerHTML = `<div class="alert-banner alert-pending">🗓️ Todavía no planificaste ninguna comida.</div>`;
  } else if(pendientes.length===0){
    banner.innerHTML = `<div class="alert-banner alert-done">✅ No falta nada por comprar.</div>`;
  } else {
    banner.innerHTML = `<div class="alert-banner alert-pending">🛒 Faltan ${pendientes.length} ${pendientes.length===1?'ingrediente':'ingredientes'} por comprar.</div>`;
  }

  CATEGORIAS_COMPRA.forEach(cat=>{
    const items = keys.filter(k=>totals[k].categoria===cat);
    const block = document.createElement('div');
    block.className='shop-category';
    if(items.length===0){
      block.innerHTML = `<h4>${cat}</h4><p class="shop-empty">Nada esta semana</p>`;
    } else {
      const rows = items.map(k=>{
        const it = totals[k];
        const sugerido = roundFinal(it.raw, it.unidad);
        const tengo = state.stock[k] || 0;
        const comprar = Math.max(0, Math.round((sugerido - tengo)*10)/10);
        const checked = !!state.compras[k];
        const buyText = comprar > 0
          ? `Comprar <span class="qty">${comprar} ${escapeHtml(it.unidad)}</span> — ${escapeHtml(it.nombre)}`
          : `${escapeHtml(it.nombre)} — ya tenés suficiente`;
        return `<div class="shop-item ${checked?'checked':''}">
          <input type="checkbox" class="chk" data-key="${escapeHtml(k)}" ${checked?'checked':''}>
          <span class="emo">${getEmoji(it.nombre,it.categoria)}</span>
          <div class="shop-main">
            <div class="buy-line ${comprar>0?'':'enough'}">${buyText}</div>
            <div class="shop-sub">Necesitás ${sugerido} ${escapeHtml(it.unidad)} en total</div>
          </div>
          <div class="stock-box">
            <span>tengo</span>
            <input type="number" min="0" step="any" data-stock="${escapeHtml(k)}" value="${tengo || ''}" placeholder="0">
          </div>
        </div>`;
      }).join('');
      block.innerHTML = `<h4>${cat}</h4>${rows}`;
    }
    container.appendChild(block);
  });

  container.querySelectorAll('input.chk').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      state.compras[e.target.getAttribute('data-key')] = e.target.checked;
      renderShoppingList(); await saveState();
    });
  });
  container.querySelectorAll('input[data-stock]').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const key = e.target.getAttribute('data-stock');
      const val = parseFloat(e.target.value);
      if(isNaN(val) || val<=0) delete state.stock[key]; else state.stock[key] = val;
      renderShoppingList(); await saveState();
    });
  });
}

document.getElementById('recipeSearch').addEventListener('input', (e)=>{
  recipeQuery = e.target.value;
  renderRecipes();
});
document.getElementById('recipeSort').addEventListener('change', (e)=>{
  recipeSort = e.target.value;
  renderRecipes();
});
document.querySelectorAll('.filter-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    recipeFilter = chip.getAttribute('data-filter');
    document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active', c===chip));
    renderRecipes();
  });
});

function renderIdeas(){
  const cont = document.getElementById('ideasList');
  cont.innerHTML='';
  if(!state.ideas || state.ideas.length===0){
    cont.innerHTML = `<div class="ideas-empty">Acá anotás platos que se te ocurren o que viste por ahí. Cuando tengas ganas de cocinar uno, lo pasás a receta con un botón.</div>`;
    return;
  }
  state.ideas.forEach(idea=>{
    const card = document.createElement('div');
    card.className='idea-card';
    card.innerHTML = `
      <h4>${escapeHtml(idea.titulo)}</h4>
      ${idea.nota?`<p>${escapeHtml(idea.nota)}</p>`:''}
      <div class="idea-actions">
        <button class="btn btn-accent" data-convert="${idea.id}">Pasar a receta</button>
        <button class="btn btn-ghost" data-delidea="${idea.id}">Borrar</button>
      </div>
    `;
    cont.appendChild(card);
  });
  cont.querySelectorAll('[data-convert]').forEach(b=>b.addEventListener('click',()=>{
    const idea = state.ideas.find(i=>i.id===b.getAttribute('data-convert'));
    convertingIdeaId = idea.id;
    openRecipeModal(null, idea);
  }));
  cont.querySelectorAll('[data-delidea]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.getAttribute('data-delidea');
    const idea = state.ideas.find(i=>i.id===id);
    openConfirm(`¿Borrar la idea "${idea.titulo}"?`, async ()=>{
      state.ideas = state.ideas.filter(i=>i.id!==id);
      renderIdeas(); await saveState();
    });
  }));
}

document.getElementById('btnAddIdea').addEventListener('click', async ()=>{
  const tituloEl = document.getElementById('ideaTitulo');
  const notaEl = document.getElementById('ideaNota');
  const titulo = tituloEl.value.trim();
  if(!titulo){ showToast('Escribí la idea primero.'); return; }
  if(!state.ideas) state.ideas = [];
  state.ideas.unshift({id:'idea-'+Date.now(), titulo, nota:notaEl.value.trim()});
  tituloEl.value=''; notaEl.value='';
  renderIdeas(); await saveState();
});

function renderPersonas(){ document.getElementById('personasValue').textContent = state.personas; }
function renderAll(){ renderWeek(); renderRecipes(); renderIdeas(); renderShoppingList(); renderPersonas(); }

document.querySelectorAll('[data-tab]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const tab = btn.getAttribute('data-tab');
    document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active', b.getAttribute('data-tab')===tab));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+tab).classList.add('active');
    window.scrollTo(0,0);
  });
});

document.getElementById('personasPlus').addEventListener('click', async ()=>{
  state.personas = Math.min(12, state.personas+1);
  renderPersonas(); renderRecipes(); renderShoppingList();
  await saveState();
});
document.getElementById('personasMinus').addEventListener('click', async ()=>{
  state.personas = Math.max(1, state.personas-1);
  renderPersonas(); renderRecipes(); renderShoppingList();
  await saveState();
});

document.getElementById('btnResetChecks').addEventListener('click', ()=>{
  openConfirm('¿Empezar una semana nueva? Se desmarcan las compras y las comidas hechas.', async ()=>{
    state.compras = {};
    DIAS.forEach(d=>state.hechos[d]=false);
    renderAll(); await saveState();
  });
});
document.getElementById('btnResetStock').addEventListener('click', ()=>{
  openConfirm('¿Poner en cero todo lo que marcaste como "ya tengo"?', async ()=>{
    state.stock = {};
    renderShoppingList(); await saveState();
  });
});
document.getElementById('btnResetData').addEventListener('click', ()=>{
  openConfirm('Esto borra tus recetas y tu semana, y vuelve a los datos de ejemplo. ¿Continuar?', async ()=>{
    state = seedData();
    renderAll(); await saveState();
  });
});

function openRecipeModal(id, idea){
  editingRecipeId = id;
  const ingRows = document.getElementById('ingRows');
  ingRows.innerHTML='';
  if(id){
    const r = findRecipe(id);
    document.getElementById('recipeModalTitle').textContent = 'Editar receta';
    document.getElementById('rNombre').value = r.nombre;
    document.getElementById('rCategoria').value = r.categoria;
    document.getElementById('rNotas').value = r.notas||'';
    document.getElementById('rTiempo').value = r.tiempo||'';
    document.getElementById('rMambo').checked = !!r.usaMambo;
    document.getElementById('rVaporeras').checked = !!r.vaporeras;
    document.getElementById('rEstacional').checked = !!r.estacional;
    document.getElementById('rPasos').value = (r.pasos||[]).join('\n');
    r.ingredientes.forEach(ing=>addIngRow(ing));
  } else {
    document.getElementById('recipeModalTitle').textContent = idea ? 'Pasar la idea a receta' : 'Nueva receta';
    ['rNombre','rNotas','rTiempo','rPasos'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('rCategoria').value = 'principal';
    ['rMambo','rVaporeras','rEstacional'].forEach(i=>document.getElementById(i).checked=false);
    if(idea){
      document.getElementById('rNombre').value = idea.titulo;
      document.getElementById('rNotas').value = idea.nota || '';
    }
    addIngRow();
  }
  document.getElementById('recipeModalOverlay').classList.add('open');
}
function closeRecipeModal(){
  document.getElementById('recipeModalOverlay').classList.remove('open');
  editingRecipeId = null;
  convertingIdeaId = null;
}
function addIngRow(ing){
  const row = document.createElement('div');
  row.className='ing-row';
  const catOptions = CATEGORIAS_COMPRA.map(c=>`<option value="${c}" ${ing&&ing.categoria===c?'selected':''}>${c}</option>`).join('');
  row.innerHTML = `
    <input type="text" class="ing-nombre" placeholder="Ingrediente" value="${ing?escapeHtml(ing.nombre):''}">
    <input type="number" class="ing-cantidad" placeholder="Cant." min="0" step="any" value="${ing?ing.cantidad:''}">
    <input type="text" class="ing-unidad" placeholder="g/unid." value="${ing?escapeHtml(ing.unidad):''}">
    <select class="ing-categoria">${catOptions}</select>
    <button type="button" class="rm">✕</button>
  `;
  row.querySelector('.rm').addEventListener('click', ()=>row.remove());
  document.getElementById('ingRows').appendChild(row);
}
document.getElementById('btnAddIng').addEventListener('click', ()=>addIngRow());
document.getElementById('btnNuevaReceta').addEventListener('click', ()=>openRecipeModal(null));
document.getElementById('btnCancelRecipe').addEventListener('click', closeRecipeModal);

document.getElementById('btnSaveRecipe').addEventListener('click', async ()=>{
  const nombre = document.getElementById('rNombre').value.trim();
  if(!nombre){ showToast('Ponele un nombre a la receta.'); return; }
  const categoria = document.getElementById('rCategoria').value;
  const notas = document.getElementById('rNotas').value.trim();
  const tiempoRaw = parseInt(document.getElementById('rTiempo').value,10);
  const tiempo = isNaN(tiempoRaw) ? null : tiempoRaw;
  const usaMambo = document.getElementById('rMambo').checked;
  const vaporeras = document.getElementById('rVaporeras').checked;
  const estacional = document.getElementById('rEstacional').checked;
  const pasos = document.getElementById('rPasos').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const ingredientes = [];
  document.querySelectorAll('#ingRows .ing-row').forEach(row=>{
    const n = row.querySelector('.ing-nombre').value.trim();
    const c = parseFloat(row.querySelector('.ing-cantidad').value);
    const u = row.querySelector('.ing-unidad').value.trim();
    const cat = row.querySelector('.ing-categoria').value;
    if(n && !isNaN(c) && u) ingredientes.push({nombre:n, cantidad:c, unidad:u, categoria:cat});
  });
  if(ingredientes.length===0){ showToast('Agregá al menos un ingrediente válido.'); return; }

  if(editingRecipeId){
    const r = findRecipe(editingRecipeId);
    Object.assign(r, {nombre, categoria, notas, ingredientes, usaMambo, vaporeras, estacional, pasos, tiempo});
  } else {
    state.recipes.push({id:'receta-'+Date.now(), nombre, categoria, notas, ingredientes, usaMambo, vaporeras, estacional, pasos, tiempo});
    if(convertingIdeaId){
      state.ideas = state.ideas.filter(i=>i.id!==convertingIdeaId);
      showToast('Idea convertida en receta.');
    }
  }
  closeRecipeModal(); renderAll(); await saveState();
});

function openConfirm(text, onYes){
  document.getElementById('confirmText').textContent = text;
  confirmCallback = onYes;
  document.getElementById('confirmOverlay').classList.add('open');
}
function closeConfirm(){
  document.getElementById('confirmOverlay').classList.remove('open');
  confirmCallback = null;
}
document.getElementById('btnConfirmNo').addEventListener('click', closeConfirm);
document.getElementById('btnConfirmYes').addEventListener('click', async ()=>{
  const cb = confirmCallback; closeConfirm(); if(cb) await cb();
});

// Suma al estado guardado las recetas nuevas que vengan en esta versión,
// sin tocar las que el usuario ya tenía ni su semana o sus compras.
function mergeNuevasRecetas(guardado){
  const base = seedData();
  let agregadas = 0;
  if(!Array.isArray(guardado.recipes)) guardado.recipes = [];
  base.recipes.forEach(r=>{
    if(!guardado.recipes.some(x=>x.id===r.id)){ guardado.recipes.push(r); agregadas++; }
  });
  if(!Array.isArray(guardado.ideas)) guardado.ideas = [];
  if(!guardado.stock) guardado.stock = {};
  if(!guardado.hechos) guardado.hechos = base.hechos;
  return agregadas;
}

// Dibuja primero, guarda después. Si el guardado no responde, la app igual funciona.
renderAll();
(async function init(){
  const statusEl = document.getElementById('saveStatus');
  const loaded = await loadState();
  if(loaded === null){
    storageOk = true;
    await saveState();
  } else if(loaded === undefined){
    storageOk = false;
    statusEl.textContent = 'Modo sin guardado: los cambios duran hasta que cierres.';
  } else if(loaded.schemaVersion === SCHEMA_VERSION){
    storageOk = true;
    state = loaded;
    const nuevas = mergeNuevasRecetas(state);
    renderAll();
    statusEl.textContent = 'Guardado ✓ — compartido con la familia.';
    if(nuevas > 0){
      showToast(`Se sumaron ${nuevas} recetas nuevas.`);
      await saveState();
    }
  } else {
    storageOk = true;
    renderAll();
    showToast('Se actualizó la app — arrancamos con los datos de ejemplo.');
    await saveState();
  }
})();
